<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<title>Мои финансы</title>
<style>
  :root{
    --bg:#0e0e11; --card:#1a1a20; --card2:#22222a;
    --text:#f2f2f5; --muted:#8a8a96; --accent:#4ade80;
    --danger:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    background:var(--bg);color:var(--text);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    padding-bottom:90px;
  }
  header{padding:16px 16px 8px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin:12px}
  .balance{font-size:32px;font-weight:700;letter-spacing:-1px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .muted{color:var(--muted);font-size:13px}
  button{
    background:var(--accent);color:#04120a;border:0;border-radius:12px;
    padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;
  }
  button.ghost{background:var(--card2);color:var(--text)}
  button.danger{background:transparent;color:var(--danger)}
  input,select{
    width:100%;background:var(--card2);border:1px solid #2e2e38;
    color:var(--text);border-radius:12px;padding:12px;font-size:16px;
    margin-bottom:10px;font-family:inherit;
  }
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
  .tabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
  .tabs button{padding:8px 14px;font-size:14px;border-radius:20px;background:var(--card);color:var(--muted)}
  .tabs button.active{background:var(--accent);color:#04120a}
  .op{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #23232b}
  .op:last-child{border-bottom:0}
  .op .icon{
    width:38px;height:38px;border-radius:50%;background:var(--card2);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;
  }
  .op .info{flex:1;min-width:0}
  .op .name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .op .cat{font-size:12px;color:var(--muted)}
  .op .amount{font-weight:600;font-size:15px;text-align:right}
  .op .amount.exp{color:var(--danger)}
  .op .amount.inc{color:var(--accent)}
  .bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar>div{height:100%;background:var(--accent);transition:width .3s}
  .bar.warn>div{background:#fbbf24}
  .bar.over>div{background:var(--danger)}
  .fab{
    position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));
    width:58px;height:58px;border-radius:50%;font-size:28px;line-height:1;
    box-shadow:0 8px 24px rgba(74,222,128,.35);z-index:10;
  }
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:flex-end;justify-content:center;z-index:100;
  }
  .modal.show{display:flex}
  .sheet{
    background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;
    padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;
  }
  .sheet h2{margin:0 0 16px;font-size:18px}
  .hidden{display:none}
  canvas{max-width:100%}
  .chart-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .legend{font-size:13px;flex:1;min-width:140px}
  .legend div{display:flex;align-items:center;gap:6px;margin:4px 0}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .empty{color:var(--muted);text-align:center;padding:24px;font-size:14px}
</style>
</head>
<body>

<header>
  <h1>Мои финансы</h1>
  <div class="sub" id="monthLabel"></div>
</header>

<div class="tabs" id="tabs">
  <button data-view="home" class="active">Главная</button>
  <button data-view="ops">Операции</button>
  <button data-view="budget">Бюджет</button>
  <button data-view="stats">Аналитика</button>
  <button data-view="settings">Настройки</button>
</div>

<main>
  <section id="view-home">
    <div class="card">
      <div class="muted">Общий баланс</div>
      <div class="balance" id="totalBalance">0 ₽</div>
      <div class="row" style="margin-top:12px">
        <div><div class="muted">Доходы за месяц</div><div id="mIncome" style="color:var(--accent);font-weight:600">0 ₽</div></div>
        <div style="text-align:right"><div class="muted">Расходы за месяц</div><div id="mExpense" style="color:var(--danger);font-weight:600">0 ₽</div></div>
      </div>
    </div>
    <div class="card">
      <div class="row"><b>Последние операции</b><button class="ghost" style="padding:6px 10px;font-size:13px" onclick="switchView('ops')">Все</button></div>
      <div id="recentOps"></div>
    </div>
  </section>

  <section id="view-ops" class="hidden">
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <select id="filterType" style="margin:0;width:auto">
          <option value="all">Все</option>
          <option value="expense">Расходы</option>
          <option value="income">Доходы</option>
        </select>
        <select id="filterMonth" style="margin:0;width:auto"></select>
      </div>
      <div id="opsList"></div>
    </div>
  </section>

  <section id="view-budget" class="hidden">
    <div class="card">
      <div class="row"><b>Лимиты на месяц</b><button class="ghost" style="padding:6px 10px;font-size:13px" onclick="openBudgetEdit()">Изменить</button></div>
      <div id="budgetList"></div>
    </div>
  </section>

  <section id="view-stats" class="hidden">
    <div class="card">
      <b>Расходы по категориям</b>
      <div class="chart-wrap" style="margin-top:12px">
        <canvas id="pie" width="160" height="160"></canvas>
        <div class="legend" id="pieLegend"></div>
      </div>
    </div>
    <div class="card">
      <b>Сводка месяца</b>
      <div id="summary" class="muted" style="margin-top:8px;line-height:1.6"></div>
    </div>
  </section>

  <section id="view-settings" class="hidden">
    <div class="card">
      <b>Счета</b>
      <div id="accountsList"></div>
      <button class="ghost" style="margin-top:10px;width:100%" onclick="openAccountEdit()">+ Добавить счёт</button>
    </div>
    <div class="card">
      <b>Категории</b>
      <div id="catsList"></div>
      <button class="ghost" style="margin-top:10px;width:100%" onclick="openCatEdit()">+ Добавить категорию</button>
    </div>
    <div class="card">
      <b>Данные</b>
      <div class="muted" style="margin:8px 0">Всё хранится только на этом устройстве в Safari.</div>
      <button class="ghost" style="width:100%;margin-bottom:8px" onclick="exportData()">📤 Экспорт (JSON)</button>
      <button class="ghost" style="width:100%;margin-bottom:8px" onclick="document.getElementById('importFile').click()">📥 Импорт</button>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
      <button class="danger" style="width:100%;margin-top:8px" onclick="if(confirm('Удалить ВСЕ данные?')){localStorage.clear();location.reload()}">Удалить все данные</button>
    </div>
  </section>
</main>

<button class="fab" onclick="openOpEdit()">+</button>

<div class="modal" id="opModal">
  <div class="sheet">
    <h2 id="opTitle">Новая операция</h2>
    <input type="hidden" id="opId">
    <label>Тип</label>
    <select id="opType">
      <option value="expense">Расход</option>
      <option value="income">Доход</option>
    </select>
    <label>Сумма</label>
    <input type="number" id="opAmount" inputmode="decimal" placeholder="0" step="0.01">
    <label>Категория</label>
    <select id="opCat"></select>
    <label>Счёт</label>
    <select id="opAccount"></select>
    <label>Дата</label>
    <input type="date" id="opDate">
    <label>Комментарий</label>
    <input type="text" id="opNote" placeholder="необязательно">
    <label style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="opRepeat" style="width:auto;margin:0"> Повторять ежемесячно
    </label>
    <div class="row" style="margin-top:14px">
      <button class="danger hidden" id="opDelete" onclick="deleteOp()">Удалить</button>
      <div style="flex:1"></div>
      <button class="ghost" onclick="closeModal('opModal')">Отмена</button>
      <button onclick="saveOp()">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal" id="catModal">
  <div class="sheet">
    <h2>Новая категория</h2>
    <label>Название</label>
    <input type="text" id="catName" placeholder="Например: Продукты">
    <label>Иконка (эмодзи)</label>
    <input type="text" id="catIcon" value="📁" maxlength="2">
    <label>Тип</label>
    <select id="catType">
      <option value="expense">Расход</option>
      <option value="income">Доход</option>
    </select>
    <div class="row" style="margin-top:14px">
      <button class="ghost" onclick="closeModal('catModal')">Отмена</button>
      <button onclick="saveCat()">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal" id="accountModal">
  <div class="sheet">
    <h2>Новый счёт</h2>
    <label>Название</label>
    <input type="text" id="accName" placeholder="Например: Карта Сбер">
    <label>Начальный баланс</label>
    <input type="number" id="accBalance" inputmode="decimal" value="0" step="0.01">
    <div class="row" style="margin-top:14px">
      <button class="ghost" onclick="closeModal('accountModal')">Отмена</button>
      <button onclick="saveAccount()">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal" id="budgetModal">
  <div class="sheet">
    <h2>Лимиты бюджета</h2>
    <div id="budgetEditList"></div>
    <div class="row" style="margin-top:14px">
      <button class="ghost" onclick="closeModal('budgetModal')">Отмена</button>
      <button onclick="saveBudget()">Сохранить</button>
    </div>
  </div>
</div>

<script>
const DEFAULT = {
  accounts: [{id:'a1', name:'Наличные', balance:0}],
  categories: [
    {id:'c1',  name:'Продукты',    icon:'🛒', type:'expense'},
    {id:'c2',  name:'Транспорт',   icon:'🚇', type:'expense'},
    {id:'c3',  name:'Кафе',        icon:'☕️', type:'expense'},
    {id:'c4',  name:'Жильё',       icon:'🏠', type:'expense'},
    {id:'c5',  name:'Здоровье',    icon:'💊', type:'expense'},
    {id:'c6',  name:'Развлечения', icon:'🎬', type:'expense'},
    {id:'c7',  name:'Одежда',      icon:'👕', type:'expense'},
    {id:'c8',  name:'Связь',       icon:'📱', type:'expense'},
    {id:'c9',  name:'Прочее',      icon:'📦', type:'expense'},
    {id:'c10', name:'Зарплата',    icon:'💼', type:'income'},
    {id:'c11', name:'Подработка',  icon:'💡', type:'income'},
    {id:'c12', name:'Подарок',     icon:'🎁', type:'income'}
  ],
  operations: [],
  budget: {},
  currency: '₽'
};

function load(){
  try{
    const raw = localStorage.getItem('finance_v1');
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT));
    const d = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), d);
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT)); }
}
let DB = load();
function save(){ localStorage.setItem('finance_v1', JSON.stringify(DB)); }

const $ = s => document.querySelector(s);
const fmt = n => (Math.round(n*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' ' + DB.currency;
const monthKey = d => d.slice(0,7);
const todayISO = () => new Date().toISOString().slice(0,10);

function getAccount(id){ return DB.accounts.find(a=>a.id===id) || {name:'—'}; }
function getCat(id){ return DB.categories.find(c=>c.id===id) || {name:'—',icon:'📁',type:'expense'}; }

function accountBalance(accId){
  const acc = DB.accounts.find(a=>a.id===accId);
  if(!acc) return 0;
  let b = acc.balance || 0;
  DB.operations.forEach(o=>{
    if(o.accountId !== accId) return;
    b += o.type==='income' ? o.amount : -o.amount;
  });
  return b;
}
function totalBalance(){ return DB.accounts.reduce((s,a)=>s+accountBalance(a.id),0); }

function switchView(v){
  document.querySelectorAll('main > section').forEach(s=>s.classList.add('hidden'));
  $('#view-'+v).classList.remove('hidden');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  if(v==='home') renderHome();
  if(v==='ops') renderOps();
  if(v==='budget') renderBudget();
  if(v==='stats') renderStats();
  if(v==='settings') renderSettings();
  window.scrollTo(0,0);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));

function currentMonthOps(){
  const mk = todayISO().slice(0,7);
  return DB.operations.filter(o=>monthKey(o.date)===mk);
}
function renderHome(){
  const now = new Date();
  $('#monthLabel').textContent = now.toLocaleDateString('ru-RU',{month:'long', year:'numeric'});
  $('#totalBalance').textContent = fmt(totalBalance());
  const mOps = currentMonthOps();
  const inc = mOps.filter(o=>o.type==='income').reduce((s,o)=>s+o.amount,0);
  const exp = mOps.filter(o=>o.type==='expense').reduce((s,o)=>s+o.amount,0);
  $('#mIncome').textContent = fmt(inc);
  $('#mExpense').textContent = fmt(exp);
  const recent = DB.operations.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  $('#recentOps').innerHTML = recent.length ? recent.map(opHTML).join('') : '<div class="empty">Пока нет операций</div>';
}
function opHTML(o){
  const c = getCat(o.catId);
  const sign = o.type==='income' ? '+' : '−';
  const cls  = o.type==='income' ? 'inc' : 'exp';
  const acc  = getAccount(o.accountId).name;
  return '<div class="op" onclick="openOpEdit(\''+o.id+'\')">'
    + '<div class="icon">'+c.icon+'</div>'
    + '<div class="info">'
    + '<div class="name">'+(o.note || c.name)+'</div>'
    + '<div class="cat">'+c.name+' · '+acc+' · '+o.date+'</div>'
    + '</div>'
    + '<div class="amount '+cls+'">'+sign+fmt(o.amount)+'</div>'
    + '</div>';
}

function renderOps(){
  const months = Array.from(new Set(DB.operations.map(o=>monthKey(o.date)))).sort().reverse();
  const sel = $('#filterMonth');
  const cur = sel.value || (months[0] || todayISO().slice(0,7));
  sel.innerHTML = (months.length?months:[todayISO().slice(0,7)]).map(m=>{
    const parts = m.split('-');
    const label = new Date(parts[0],parts[1]-1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    return '<option value="'+m+'" '+(m===cur?'selected':'')+'>'+label+'</option>';
  }).join('');
  const type = $('#filterType').value;
  let list = DB.operations.filter(o=>monthKey(o.date)===cur);
  if(type!=='all') list = list.filter(o=>o.type===type);
  list.sort((a,b)=>b.date.localeCompare(a.date));
  $('#opsList').innerHTML = list.length ? list.map(opHTML).join('') : '<div class="empty">Нет операций за этот месяц</div>';
}
$('#filterType').onchange = renderOps;
$('#filterMonth').onchange = renderOps;

function renderBudget(){
  const mk = todayISO().slice(0,7);
  const spent = {};
  DB.operations.filter(o=>o.type==='expense' && monthKey(o.date)===mk)
    .forEach(o=>{ spent[o.catId] = (spent[o.catId]||0) + o.amount; });
  const budgeted = DB.categories.filter(c=>c.type==='expense' && DB.budget[c.id]>0);
  if(!budgeted.length){
    $('#budgetList').innerHTML = '<div class="empty">Лимиты не заданы. Нажми «Изменить».</div>';
    return;
  }
  $('#budgetList').innerHTML = budgeted.map(c=>{
    const limit = DB.budget[c.id];
    const used  = spent[c.id] || 0;
    const pct   = Math.min(100, used/limit*100);
    const cls   = used>limit ? 'over' : (pct>80 ? 'warn' : '');
    return '<div style="margin:12px 0">'
      + '<div class="row"><span>'+c.icon+' '+c.name+'</span><span class="muted">'+fmt(used)+' / '+fmt(limit)+'</span></div>'
      + '<div class="bar '+cls+'"><div style="width:'+pct+'%"></div></div>'
      + '</div>';
  }).join('');
}
function openBudgetEdit(){
  $('#budgetEditList').innerHTML = DB.categories.filter(c=>c.type==='expense').map(c=>
    '<label>'+c.icon+' '+c.name+'</label>'
    + '<input type="number" data-bcat="'+c.id+'" value="'+(DB.budget[c.id]||'')+'" placeholder="0" inputmode="decimal">'
  ).join('');
  $('#budgetModal').classList.add('show');
}
function saveBudget(){
  DB.budget = {};
  document.querySelectorAll('#budgetEditList input[data-bcat]').forEach(inp=>{
    const v = parseFloat(inp.value);
    if(v>0) DB.budget[inp.dataset.bcat] = v;
  });
  save(); closeModal('budgetModal'); renderBudget();
}

function renderStats(){
  const mk = todayISO().slice(0,7);
  const ops = DB.operations.filter(o=>o.type==='expense' && monthKey(o.date)===mk);
  const byCat = {};
  ops.forEach(o=>{ byCat[o.catId] = (byCat[o.catId]||0) + o.amount; });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,e)=>s+e[1],0);
  const canvas = $('#pie'); const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,160,160);
  const colors = ['#4ade80','#60a5fa','#fbbf24','#f87171','#a78bfa','#f472b6','#34d399','#fb923c','#22d3ee','#94a3b8'];
  if(total===0){
    ctx.fillStyle='#2a2a32'; ctx.beginPath(); ctx.arc(80,80,70,0,Math.PI*2); ctx.fill();
  } else {
    let start = -Math.PI/2;
    entries.forEach((e,i)=>{
      const a = e[1]/total * Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(80,80);
      ctx.arc(80,80,70,start,start+a);
      ctx.closePath();
      ctx.fillStyle = colors[i%colors.length];
      ctx.fill();
      start += a;
    });
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(80,80,38,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }
  $('#pieLegend').innerHTML = entries.length ? entries.map((e,i)=>{
    const c = getCat(e[0]);
    return '<div><span class="dot" style="background:'+colors[i%colors.length]+'"></span>'+c.icon+' '+c.name+' — '+fmt(e[1])+' ('+(e[1]/total*100).toFixed(0)+'%)</div>';
  }).join('') : '<div class="muted">Нет расходов в этом месяце</div>';
  const inc = DB.operations.filter(o=>o.type==='income' && monthKey(o.date)===mk).reduce((s,o)=>s+o.amount,0);
  const avg = ops.length ? total/ops.length : 0;
  const top = entries[0] ? getCat(entries[0][0]).name : '—';
  $('#summary').innerHTML = '💸 Всего расходов: <b>'+fmt(total)+'</b><br>'
    + '💰 Всего доходов: <b>'+fmt(inc)+'</b><br>'
    + '📊 Остаток: <b>'+fmt(inc-total)+'</b><br>'
    + '🧾 Средний чек: <b>'+fmt(avg)+'</b><br>'
    + '🥇 Топ-категория: <b>'+top+'</b><br>'
    + '📅 Операций за месяц: <b>'+ops.length+'</b>';
}

function renderSettings(){
  $('#accountsList').innerHTML = DB.accounts.map(a=>
    '<div class="row" style="padding:8px 0;border-bottom:1px solid #23232b"><span>'+a.name+'</span><span class="muted">'+fmt(accountBalance(a.id))+'</span></div>'
  ).join('');
  $('#catsList').innerHTML = DB.categories.map(c=>
    '<div class="row" style="padding:8px 0;border-bottom:1px solid #23232b"><span>'+c.icon+' '+c.name+'</span><span class="muted">'+(c.type==='income'?'доход':'расход')+'</span></div>'
  ).join('');
}
function openCatEdit(){ $('#catName').value=''; $('#catIcon').value='📁'; $('#catModal').classList.add('show'); }
function saveCat(){
  const name = $('#catName').value.trim();
  if(!name) return alert('Введи название');
  DB.categories.push({id:'c'+Date.now(), name:name, icon:$('#catIcon').value||'📁', type:$('#catType').value});
  save(); closeModal('catModal'); renderSettings();
}
function openAccountEdit(){ $('#accName').value=''; $('#accBalance').value='0'; $('#accountModal').classList.add('show'); }
function saveAccount(){
  const name = $('#accName').value.trim();
  if(!name) return alert('Введи название');
  DB.accounts.push({id:'a'+Date.now(), name:name, balance:parseFloat($('#accBalance').value)||0});
  save(); closeModal('accountModal'); renderSettings();
}

function openOpEdit(id){
  $('#opType').value='expense';
  $('#opAmount').value='';
  $('#opDate').value = todayISO();
  $('#opNote').value='';
  $('#opRepeat').checked=false;
  $('#opId').value='';
  $('#opTitle').textContent='Новая операция';
  $('#opDelete').classList.add('hidden');
  fillSelects();
  if(id){
    const o = DB.operations.find(x=>x.id===id);
    if(!o) return;
    $('#opId').value = o.id;
    $('#opType').value = o.type;
    $('#opAmount').value = o.amount;
    $('#opDate').value = o.date;
    $('#opNote').value = o.note||'';
    $('#opRepeat').checked = !!o.repeat;
    $('#opTitle').textContent = 'Операция';
    $('#opDelete').classList.remove('hidden');
    fillSelects();
    $('#opCat').value = o.catId;
    $('#opAccount').value = o.accountId;
  }
  $('#opModal').classList.add('show');
}
function fillSelects(){
  const type = $('#opType').value;
  $('#opCat').innerHTML = DB.categories.filter(c=>c.type===type).map(c=>'<option value="'+c.id+'">'+c.icon+' '+c.name+'</option>').join('');
  $('#opAccount').innerHTML = DB.accounts.map(a=>'<option value="'+a.id+'">'+a.name+'</option>').join('');
}
$('#opType').onchange = fillSelects;

function saveOp(){
  const amt = parseFloat($('#opAmount').value);
  if(!amt || amt<=0) return alert('Введи корректную сумму');
  const id = $('#opId').value;
  const data = {
    type: $('#opType').value,
    amount: amt,
    catId: $('#opCat').value,
    accountId: $('#opAccount').value,
    date: $('#opDate').value || todayISO(),
    note: $('#opNote').value.trim(),
    repeat: $('#opRepeat').checked
  };
  if(id){
    const i = DB.operations.findIndex(o=>o.id===id);
    DB.operations[i] = Object.assign(DB.operations[i], data);
  } else {
    DB.operations.push(Object.assign({id:'o'+Date.now()}, data));
  }
  save(); closeModal('opModal'); switchView('home');
}
function deleteOp(){
  const id = $('#opId').value;
  if(!id) return;
  if(!confirm('Удалить операцию?')) return;
  DB.operations = DB.operations.filter(o=>o.id!==id);
  save(); closeModal('opModal'); switchView('home');
}
function closeModal(id){ $('#'+id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('show'); });
});

function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'finance-backup-' + todayISO() + '.json';
  a.click();
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      DB = Object.assign(DB, JSON.parse(r.result));
      save(); alert('Импортировано'); location.reload();
    }catch(err){ alert('Ошибка файла'); }
  };
  r.readAsText(f);
}

renderHome();
</script>
</body>
</html>
